name: up_down_portrait
format: portrait
tool_id: 1
interpolation: joint
ramp_fraction: 0.2
# The portrait wrist sits at J5 = 0 (the wrist singularity) for this whole
# move; only J2 and J4 swing, and with J5 = 0 exactly the joint blend holds
# roll at 90deg (checked on FK by check_roll). No per-sample wrist solve.
level_wrist: false
sample_period_ms: 8
seed_joints: [90.0, -78.788727, 0.052865, 18.040855, 0.0, 45.0]
orientation:
  mode: angles
workspace:  # the camera path plus ~50-100 mm (path: x 162, y -1320..-597,
  # z -452..711 on the simulator; the real robot differs by ~28 mm)
  min: [50, -1420, -550]
  max: [300, -500, 800]
keyframes:
- t: 0.0
  # read on the robot (J5 was 0.947: 0.947deg of roll error); J5 set to 0
  joints: [90.0, -78.788727, 0.052865, 18.040855, 0.0, 45.0]
- t: 1.5
  # read on the robot (J5 was 0.999865); J5 set to 0
  joints: [90.0, 70.973854, 0.052865, -181.02684, 0.0, 45.0]
limits:
  max_tcp_speed_mm_s: 3000.0
  max_joint_speed_deg_s: 180.0
  max_joint_acc_deg_s2: 1500.0
